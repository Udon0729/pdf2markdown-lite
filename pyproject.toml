[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pdfmdlite"
version = "0.1.0"
description = "CPU-only PDF to Markdown converter focused on layout-aware text PDFs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Codex" }]
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
figures = ["pymupdf>=1.24"]

[project.scripts]
pdfmdlite = "pdfmdlite.cli:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/pdfmdlite"]
